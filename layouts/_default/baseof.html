<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - دبستان دکتر حافظی</title>
  
  <!-- لینک مستقیم و مطمئن به فایل CSS -->
  {{ $styles := resources.Get "css/extended/custom.css" }}
  {{ if $styles }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}">
  {{ else }}
    <!-- اگر هوگو فایل را پیدا نکرد، این پیام را در کنسول مرورگر خواهید دید -->
    <link rel="stylesheet" href="/css/extended/custom.css">
  {{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "footer.html" . }}
</body>
</html>
